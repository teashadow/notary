[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notary"
version = "0.1.0"
description = "MAD mutation gate — HMAC-signed authorization for irreversible agent actions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.0",
  "rich>=13.0",
]

[project.scripts]
notary = "notary_app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
